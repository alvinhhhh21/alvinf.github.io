<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlvinF • Linktree Master Lengkap</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { font-family: 'Inter', system_ui, sans-serif; }
        .link-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .link-card:hover { transform: translateY(-4px); }
    </style>
</head>
<body class="bg-slate-950 text-slate-200">
    <!-- Navbar -->
    <nav class="sticky top-0 z-50 bg-slate-950/90 backdrop-blur-lg border-b border-slate-800">
        <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
            <div class="flex items-center gap-x-3">
                <div class="w-10 h-10 bg-indigo-600 rounded-2xl flex items-center justify-center">
                    <i class="fas fa-graduation-cap text-white text-2xl"></i>
                </div>
                <div>
                    <h1 class="font-bold text-2xl tracking-tight">AlvinF</h1>
                    <p class="text-xs text-slate-400 -mt-1">Master Lengkap</p>
                </div>
            </div>
            <a href="https://instagram.com/alvinf.__" target="_blank"
               class="flex items-center gap-x-2 px-8 py-2.5 bg-white text-slate-900 rounded-3xl text-sm font-bold hover:bg-amber-400 transition-colors">
                <i class="fab fa-instagram"></i>
                <span>@alvinf.__</span>
            </a>
        </div>
    </nav>

    <!-- Hero -->
    <div class="max-w-6xl mx-auto px-6 pt-10 pb-8 text-center">
        <div class="w-24 h-24 mx-auto bg-gradient-to-br from-indigo-500 via-purple-500 to-pink-500 rounded-3xl flex items-center justify-center mb-6 shadow-2xl">
            <i class="fas fa-user-graduate text-white text-5xl"></i>
        </div>
        <h1 class="text-5xl font-bold tracking-tighter">AlvinF • Linktree</h1>
        <p class="text-slate-400 mt-3 text-lg">Kumpulan materi kuliah terlengkap dari berbagai jurusan</p>
        
        <a href="https://instagram.com/alvinf.__" target="_blank"
           class="mt-8 inline-flex items-center gap-x-3 px-10 py-4 bg-white text-slate-900 rounded-3xl font-bold text-xl shadow-2xl hover:scale-[1.02] active:scale-[0.985] transition-all">
            <i class="fab fa-instagram text-3xl"></i>
            <span>Follow @alvinf.__</span>
        </a>
    </div>

    <!-- Search -->
    <div class="max-w-3xl mx-auto px-6 pb-10">
        <div class="relative">
            <input type="text" id="searchInput" 
                   class="w-full bg-slate-900 border border-slate-700 focus:border-indigo-500 rounded-3xl py-4 pl-14 pr-6 text-base placeholder:text-slate-400 outline-none"
                   placeholder="Cari jurusan atau mata kuliah...">
            <i class="fas fa-search absolute left-6 top-4.5 text-xl text-slate-400"></i>
        </div>
    </div>

    <!-- All Categories -->
    <div class="max-w-6xl mx-auto px-6 pb-20 space-y-4" id="content">

        <!-- Link Baru -->
        <div class="section">
            <div onclick="toggleSection(this)" class="category-header flex items-center justify-between px-6 py-4 bg-slate-900 hover:bg-slate-800 rounded-3xl cursor-pointer">
                <div class="flex items-center gap-x-4"><i class="fas fa-folder-open text-indigo-400 w-6 text-xl"></i><span class="font-semibold text-xl">Link Baru</span></div>
                <i class="fas fa-chevron-down transition-transform text-xl"></i>
            </div>
            <div class="hidden mt-2 px-2 space-y-1.5">
                <a href="https://drive.google.com/drive/folders/1TYkrVcse39Gr6aL42QLOmPGovs9aWwS1" target="_blank" class="block px-6 py-3.5 bg-slate-900 hover:bg-slate-800 rounded-3xl text-sm flex items-center gap-x-3 link-card"><i class="fas fa-folder text-amber-400 w-5"></i> Folder Master Lengkap</a>
            </div>
        </div>

    </div>

    <footer class="text-center py-10 text-xs text-slate-500">
        Dibuat dengan ❤️ oleh AlvinF • 2026 • instagram.com/alvinf.__
    </footer>

    <script>
        function toggleSection(element) {
            const content = element.nextElementSibling;
            const icon = element.querySelector('i.fa-chevron-down');
            if (content.classList.contains('hidden')) {
                content.classList.remove('hidden');
                icon.style.transform = 'rotate(180deg)';
            } else {
                content.classList.add('hidden');
                icon.style.transform = 'rotate(0deg)';
            }
        }

        function setupSearch() {
            const searchInput = document.getElementById('searchInput');
            const sections = document.querySelectorAll('.section');

            searchInput.addEventListener('input', function() {
                const term = this.value.toLowerCase().trim();
                sections.forEach(section => {
                    const headerText = section.querySelector('.category-header').textContent.toLowerCase();
                    const links = section.querySelectorAll('a');
                    let hasMatch = headerText.includes(term);
                    if (!hasMatch) {
                        links.forEach(link => {
                            if (link.textContent.toLowerCase().includes(term)) hasMatch = true;
                        });
                    }
                    section.style.display = (hasMatch || term === '') ? '' : 'none';
                });
            });
        }

        window.onload = function() {
            setupSearch();
            setTimeout(() => {
                const first = document.querySelector('.section .category-header');
                if (first) first.click();
            }, 700);
        }
    </script>
</body>
</html>
