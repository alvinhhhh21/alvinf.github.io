<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>@alvinf.___</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Archivo+Black&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #fffdf5; --black: #000; --yellow: #FFDE59; --pink: #FF6B9D;
      --lime: #9EF01A; --cyan: #4DFFF3; --orange: #FF9F43; --white: #fff;
      --border: 4px solid var(--black);
      --shadow: 8px 8px 0 var(--black);
      --shadow-sm: 5px 5px 0 var(--black);
      --radius: 6px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Space Grotesk', system-ui, sans-serif; background: var(--bg); color: var(--black); min-height: 100vh; overflow-x: hidden; position: relative; }

    .bg-shapes { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
    .shape { position: absolute; border: var(--border); box-shadow: var(--shadow-sm); }
    .shape-1 { width: 120px; height: 120px; background: var(--yellow); top: 8%; left: -40px; transform: rotate(15deg); }
    .shape-2 { width: 80px; height: 80px; background: var(--pink); top: 20%; right: 5%; border-radius: 50%; }
    .shape-3 { width: 160px; height: 60px; background: var(--lime); bottom: 15%; left: 8%; transform: rotate(-8deg); }
    .shape-4 { width: 90px; height: 90px; background: var(--cyan); bottom: 25%; right: -20px; transform: rotate(25deg); }
    .shape-5 { width: 50px; height: 50px; background: var(--orange); top: 55%; left: 15%; box-shadow: 4px 4px 0 var(--black); }

    .container { position: relative; z-index: 1; max-width: 900px; margin: 0 auto; padding: 60px 20px; }

    header { text-align: center; margin-bottom: 48px; }
    .badge { display: inline-block; background: var(--pink); border: var(--border); box-shadow: var(--shadow-sm); padding: 8px 18px; font-size: .85rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 24px; border-radius: var(--radius); }
    h1 { font-family: 'Archivo Black', sans-serif; font-size: clamp(2.8rem, 10vw, 5rem); line-height: .95; letter-spacing: -1px; margin-bottom: 16px; text-transform: uppercase; }
    .subtitle { font-size: 1.15rem; font-weight: 600; max-width: 420px; margin: 0 auto 8px; line-height: 1.4; }
    .handle { display: inline-block; background: var(--yellow); border: 3px solid var(--black); padding: 6px 14px; font-weight: 700; font-size: 1rem; margin-top: 12px; box-shadow: 4px 4px 0 var(--black); border-radius: 4px; }

    /* Semua link: tanpa garis bawah, warna tidak berubah saat visited */
    a.link-card, a.link-card:visited { color: var(--black); text-decoration: none; }

    /* Tombol/kartu bergaya fisik: naik saat hover, menekan saat diklik */
    .link-card { transition: transform .15s ease, box-shadow .15s ease; }
    .link-card:focus-visible { outline: 4px solid var(--black); outline-offset: 5px; }

    .hero-card { display: block; background: var(--yellow); border: var(--border); box-shadow: var(--shadow); border-radius: var(--radius); padding: 32px 28px; text-align: center; margin-bottom: 40px; }
    .hero-card:hover { transform: translate(-3px, -3px); box-shadow: 11px 11px 0 var(--black); }
    .hero-card:active { transform: translate(4px, 4px); box-shadow: 0 0 0 var(--black); }
    .hero-icon { font-size: 3.5rem; margin-bottom: 12px; display: block; }
    .hero-card h2 { font-family: 'Archivo Black', sans-serif; font-size: clamp(1.6rem, 5vw, 2.2rem); text-transform: uppercase; }
    .hero-card p { font-size: 1rem; font-weight: 500; margin-bottom: 24px; }

    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; background: var(--black); color: var(--white); border: 3px solid var(--black); padding: 14px 28px; font-size: 1.1rem; font-weight: 700; border-radius: var(--radius); box-shadow: 5px 5px 0 #333; transition: background .12s, color .12s; }
    .hero-card:hover .btn { background: var(--white); color: var(--black); }
    .btn svg { transition: transform .15s ease; }
    .hero-card:hover .btn svg { transform: translate(2px, -2px); }

    .section-title { font-family: 'Archivo Black', sans-serif; font-size: 1.4rem; text-transform: uppercase; margin-bottom: 20px; text-align: center; }

    .social-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 24px; }
    .social-card { position: relative; border: var(--border); box-shadow: var(--shadow-sm); border-radius: var(--radius); padding: 28px 22px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .social-card:hover { transform: translate(-3px, -3px); box-shadow: 8px 8px 0 var(--black); }
    .social-card:active { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--black); }
    .social-card.tiktok { background: var(--cyan); }
    .social-card.instagram { background: var(--pink); }
    .social-card.youtube { background: var(--lime); }

    .social-icon { font-size: 2.8rem; line-height: 1; }
    .social-card h3 { font-family: 'Archivo Black', sans-serif; font-size: 1.35rem; text-transform: uppercase; }
    .social-user { font-size: .95rem; font-weight: 700; background: var(--white); border: 3px solid var(--black); border-radius: 4px; padding: 4px 12px; }
    .social-go { position: absolute; top: 10px; right: 10px; width: 30px; height: 30px; display: grid; place-items: center; background: var(--black); color: var(--white); border-radius: 4px; transition: transform .15s ease; }
    .social-card:hover .social-go { transform: translate(2px, -2px); }

    @media (max-width: 600px) {
      .container { padding: 28px 16px 48px; }
      .hero-card { padding: 24px 18px; }
      .btn { width: 100%; }
      .shape-1, .shape-3 { display: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      .link-card, .btn svg, .social-go { transition: none; }
    }
  </style>
</head>
<body>
  <div class="bg-shapes" aria-hidden="true">
    <div class="shape shape-1"></div><div class="shape shape-2"></div><div class="shape shape-3"></div><div class="shape shape-4"></div><div class="shape shape-5"></div>
  </div>

  <div class="container">

    <a href="https://drive.google.com/drive/folders/1TYkrVcse39Gr6aL42QLOmPGovs9aWwS1" target="_blank" rel="noopener noreferrer" class="link-card hero-card">
      <span class="hero-icon" aria-hidden="true">📁</span>
      <h2>Google Drive</h2>
    </a>

    <div class="social-grid">
      <a href="https://www.tiktok.com/@alvinf.___" target="_blank" rel="noopener noreferrer" class="link-card social-card tiktok">
        <span class="social-go" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="7" y1="17" x2="17" y2="7"/><polyline points="7 7 17 7 17 17"/></svg></span>
        <span class="social-icon" aria-hidden="true">🎵</span>
        <h3>TikTok</h3>
      </a>

      <a href="https://www.instagram.com/alvinf.__" target="_blank" rel="noopener noreferrer" class="link-card social-card instagram">
        <span class="social-go" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="7" y1="17" x2="17" y2="7"/><polyline points="7 7 17 7 17 17"/></svg></span>
        <span class="social-icon" aria-hidden="true">📸</span>
        <h3>Instagram</h3>
      </a>

      <a href="https://www.youtube.com/@alvinfhhh" target="_blank" rel="noopener noreferrer" class="link-card social-card youtube">
        <span class="social-go" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="7" y1="17" x2="17" y2="7"/><polyline points="7 7 17 7 17 17"/></svg></span>
        <span class="social-icon" aria-hidden="true">▶️</span>
        <h3>YouTube</h3>
      </a>
    </div>
  </div>
</body>
</html>
